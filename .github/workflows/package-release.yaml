name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version (e.g. 1.0.0)"
        required: true
      nextSnapshotVersion:
        description: "Version (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for tags

      - name: Set version
        id: vars
        run: |
          echo "VERSION=${{ github.event.inputs.releaseVersion }}" >> $GITHUB_ENV
          echo "NEW_VERSION=${{ github.event.inputs.nextSnapshotVersion }}" >> $GITHUB_ENV

      - name: Set version to be released
        run: |
          chmod +x ./set-version.sh
          ./set-version.sh "$VERSION"

      - name: Commit release version update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "Updated version ${NEW_VERSION}"
          git push origin HEAD:main


      - name: Run packaging script
        run: |
          chmod +x ./package.sh
          ./package.sh "$VERSION"

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${VERSION}
          git push origin ${VERSION}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            build/*.zip

      - name: Set new version
        run: |
          chmod +x ./set-version.sh
          ./set-version.sh "$NEW_VERSION"

      - name: Commit release version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "Updated version ${NEW_VERSION}"
          git push origin HEAD:main
